name: recycle_vision
description: "Recycle Vision — AI-powered waste scanning connected to the EcoLoop Station."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Networking (multipart AI upload, interceptor auth)
  dio: ^5.7.0

  # Camera capture + gallery upload fallback
  camera: ^0.11.0
  image_picker: ^1.1.2

  # Real-session token storage on-device
  flutter_secure_storage: ^9.2.4

  # Date/time formatting
  intl: ^0.19.0

  # Shared domain (models, routing + confidence policies)
  shared:
    path: ../shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700