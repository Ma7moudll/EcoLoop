# EcoLoop broker — authenticated, least-privilege (dev parity with prod).
#
# Identities (passwords provisioned with `mosquitto_passwd -c <file> <user>`;
# NEVER commit the password file):
#   backend   — full control of the station topic tree
#   station   — one identity per physical station (here: ST-001)
#
# Topic contract (docs/mqtt-contract.md):
#   ecoloop/stations/{code}/command    backend -> station
#   ecoloop/stations/{code}/capture_request  backend -> station camera
#   ecoloop/stations/{code}/state|sensor|event|heartbeat  station -> backend
listener 1883

# Authentication REQUIRED — no anonymous access.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/acl

max_queued_messages 1000
message_size_limit 0

# Retain station state so the backend learns machine state even if it
# subscribes after the simulator has started.
persistence false
