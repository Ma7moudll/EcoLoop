# EcoLoop — full local stack using HiveMQ Cloud as MQTT broker.
#   docker compose -f infra/docker-compose.yml up --build
#
# MQTT: this stack connects to HiveMQ Cloud (TLS, port 8883). No local broker
# is required. Credentials come from environment variables / .env file.
#
# SECRETS: Copy infra/.env.example → infra/.env and fill in your values.
# JWT_SECRET and STATION_API_KEY must be set before starting.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecoloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecoloop}
      POSTGRES_DB: ecoloop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoloop -d ecoloop"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M

  ai-service:
    build: ../ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_CLASSIFIER: real
      AI_MODEL_PATH: models/model.onnx
    ports:
      - "127.0.0.1:8051:8051"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request;urllib.request.urlopen(''http://localhost:8051/health'', timeout=2)" || exit 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://recycle:${POSTGRES_PASSWORD:-ecoloop}@db:5432/ecoloop
      # HiveMQ Cloud — TLS MQTT broker (no local Mosquitto needed)
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-8d937abc7785435391e5f48c62f4e99c.s1.eu.hivemq.cloud}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT:-8883}
      MQTT_TLS: ${MQTT_TLS:-true}
      MQTT_USERNAME: ${MQTT_USERNAME:-ECOLOOP}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in infra/.env}
      AI_SERVICE_URL: http://ai-service:8051
      STATION_API_KEY: ${STATION_API_KEY:?set STATION_API_KEY in infra/.env}
      SEED_ON_STARTUP: "true"
      SEED_DEMO_USER: "false"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/.env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M

  # Optional: run the simulated ESP32 inside Docker too.
  #   docker compose -f infra/docker-compose.yml --profile simulator up simulator
  simulator:
    build:
      context: ../hardware-simulator
      dockerfile: Dockerfile
    profiles: ["simulator"]
    restart: unless-stopped
    environment:
      # HiveMQ Cloud — same broker as backend
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-8d937abc7785435391e5f48c62f4e99c.s1.eu.hivemq.cloud}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT:-8883}
      MQTT_TLS: ${MQTT_TLS:-true}
      MQTT_USERNAME: ${MQTT_USERNAME:-ECOLOOP}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in infra/.env}
      BACKEND_URL: http://backend:8000
      STATION_API_KEY: ${STATION_API_KEY:?set STATION_API_KEY in infra/.env}
      STATION_ID: st-001
      STATION_CODE: ST-001
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
